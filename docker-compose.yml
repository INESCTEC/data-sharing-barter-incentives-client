version: "3.7"
services:

  app:
    platform: linux/amd64
    build:
      context: .
      args:
        GITLAB_TOKEN: ${GITLAB_TOKEN}
    container_name: predico-rest-client-python
    env_file:
      - .env
    volumes:
      - storage:/app/files
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: predico-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: predico-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./html:/var/www/html
    entrypoint: >
      sh -c "trap exit TERM; while :; do
             certbot renew --webroot -w /var/www/html;
             sleep 12h & wait $${!};
             done"

  db:
    image: postgres:12.0-alpine
    container_name: predico-client_postgresql
    restart: always
    env_file:
      - .env
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  storage:
  postgresql-data:
  certbot-etc:
  certbot-var:

