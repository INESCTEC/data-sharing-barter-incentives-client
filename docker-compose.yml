version: "3.7"
services:

  app:
    platform: linux/amd64
    build:
      context: .
      args:
        GITLAB_TOKEN: ${GITLAB_TOKEN}
    container_name: predico-rest-client-python
    env_file:
      - .env
    volumes:
      - storage:/app/files
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: predico-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app

  # Service for handling SSL certificates with Certbot
  certbot:
    image: certbot/certbot
    container_name: certbot
    entrypoint: /init_and_renew.sh
    volumes:
      - ./nginx/init_and_renew.sh:/init_and_renew.sh
      - letsencrypt_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - default
  db:
    image: postgres:12.0-alpine
    container_name: predico-client_postgresql
    restart: always
    env_file:
      - .env
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432"

volumes:
  storage:
  postgresql-data:
  letsencrypt_data:
    external: true
  certbot_www:
    external: true

